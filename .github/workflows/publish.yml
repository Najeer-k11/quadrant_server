name: Publish to pub.dev
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # matches pub.dev tag pattern 'v{{version}}'
jobs:
  publish:
    permissions:
      id-token: write # required for OIDC login
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
