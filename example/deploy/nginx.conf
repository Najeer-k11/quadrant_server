# Replace api.example.com with your domain, then let certbot add HTTPS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream quadrant_example {
    server 127.0.0.1:5050;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # A little over maxUploadBytes in lib/handlers/files.dart, so that the app
    # answers with its own 413.
    client_max_body_size 101m;

    # These apply to every location that sets no proxy_set_header of its own.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Appends the real client address. TRUSTED_PROXY_HOPS=1 reads that entry,
    # so a value forged by the client is ignored.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    # If an app isolate dies, its open connections get no error. This timeout
    # is what ends those requests for the client.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # The app's health check stays private. Check it from the server itself.
    location = /health {
        return 404;
    }

    # Uploads go straight to the app, which streams them to disk and applies
    # its limits, instead of nginx saving a copy first.
    location = /api/v1/files {
        proxy_pass http://quadrant_example;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://quadrant_example;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Longer than the app's 30-second heartbeat, which keeps it busy.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://quadrant_example;
    }
}
